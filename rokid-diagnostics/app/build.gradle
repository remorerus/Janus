plugins {
    id 'com.android.application'
}

android {
    namespace 'com.remorerus.rokiddiagnostics'
    compileSdk 35

    defaultConfig {
        applicationId 'com.remorerus.rokiddiagnostics'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
