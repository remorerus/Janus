run-name: RE:Vision signed APK build (${{ github.ref_name }})
name: Build RE:Vision APK

on:
  push:
    branches:
      - revision-aiui-agent
      - revision-r08-stability
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle"
      - "shared-build.gradle"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: revision-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Prepare release signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.REVISION_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          raw = os.environ.get("SIGNING_BUNDLE", "")
          if not raw.strip():
              raise SystemExit("Missing GitHub Actions secret: REVISION_SIGNING_BUNDLE")
          values = {}
          for line in raw.splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  values[key.strip()] = value.strip()
          required = ("KEYSTORE_BASE64", "KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD")
          missing = [key for key in required if not values.get(key)]
          if missing:
              raise SystemExit("Signing bundle is missing required fields: " + ", ".join(missing))
          key_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "revision-signing.jks"
          key_path.write_bytes(base64.b64decode(values["KEYSTORE_BASE64"], validate=True))
          for key in required[1:]:
              print("::add-mask::" + values[key])
          commands = [
              "UPLOAD_KEYSTORE_PATH=" + str(key_path),
              "KEYSTORE_PASSWORD=" + values["KEYSTORE_PASSWORD"],
              "KEY_ALIAS=" + values["KEY_ALIAS"],
              "KEY_PASSWORD=" + values["KEY_PASSWORD"],
          ]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("\n".join(commands) + "\n")
          PY
          test -s "$RUNNER_TEMP/revision-signing.jks"
      - name: Verify signing key
        run: |
          keytool -list -keystore "$UPLOAD_KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Release signing key verified."
      - name: Build APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug assembleRelease \
            -PUPLOAD_KEYSTORE_PATH="$UPLOAD_KEYSTORE_PATH" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RE-Vision-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RE-Vision-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
