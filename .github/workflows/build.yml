run-name: RE:Vision APK build (${{ github.ref_name }})
name: Build RE:Vision APK
on:
  push:
    branches:
      - revision-aiui-agent
      - revision-1.9.9-pin
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle"
      - "shared-build.gradle"
      - ".github/workflows/build.yml"
  workflow_dispatch:
concurrency:
  group: revision-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Configure persistent RE:Vision signing
        env:
          REVISION_SIGNING_BUNDLE: ${{ secrets.REVISION_SIGNING_BUNDLE }}
        run: |
          test -n "$REVISION_SIGNING_BUNDLE" || { echo "Missing GitHub Actions secret REVISION_SIGNING_BUNDLE"; exit 1; }
          KEYSTORE_PASSWORD="$(printf '%s' "$REVISION_SIGNING_BUNDLE" | sed -n '1p')"
          KEYSTORE_BASE64="$(printf '%s' "$REVISION_SIGNING_BUNDLE" | sed '1d' | tr -d '\r\n')"
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/revision-signing.jks"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "REVISION_KEYSTORE_PATH=$HOME/.android/revision-signing.jks" >> "$GITHUB_ENV"
          echo "REVISION_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RE-Vision-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
