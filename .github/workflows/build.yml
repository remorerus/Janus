run-name: RE:Vision APK build (${{ github.ref_name }})
name: Build RE:Vision APK

on:
  push:
    branches:
      - revision-aiui-agent
      - revision-1.9.9-pin
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle"
      - "shared-build.gradle"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: revision-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RE-Vision-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
