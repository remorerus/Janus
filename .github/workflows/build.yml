run-name: RE:Vision signed APK build (${{ github.ref_name }}) # Wi-Fi diagnostics rebuild
name: Build RE:Vision APK

on:
  push:
    branches:
      - revision-aiui-agent
      - revision-r08-stability
      - revision-1.9.20-integrated
      - revision-windows-agent-integration-test
      - revision-windows-agent-apk-retry
      - revision-stability-polish-2026-11-24b
      - revision-ssh-key-only-2026-11-25
      - revision-voicebridge-tap-ssh-manager-2026-11-25
      - revision-win-ssh-web-manager-2026-11-25
      - revision-voice-windows-controls-2026-11-25
      - revision-device-card-ssh-approval-2026-11-26
      - revision-dynamic-agent-ip-2026-11-26
      - revision-crash-folder-2026-11-27
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle"
      - "shared-build.gradle"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: revision-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Prepare release signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.REVISION_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          raw = os.environ.get("SIGNING_BUNDLE", "")
          if not raw.strip():
              raise SystemExit("Missing GitHub Actions secret: REVISION_SIGNING_BUNDLE")
          values = {}
          for line in raw.splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  values[key.strip()] = value.strip()
          required = ("KEYSTORE_BASE64", "KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD")
          missing = [key for key in required if not values.get(key)]
          if missing:
              raise SystemExit("Signing bundle is missing required fields: " + ", ".join(missing))
          key_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "revision-signing.jks"
          key_path.write_bytes(base64.b64decode(values["KEYSTORE_BASE64"], validate=True))
          for key in required[1:]:
              print("::add-mask::" + values[key])
          commands = [
              "UPLOAD_KEYSTORE_PATH=" + str(key_path),
              "KEYSTORE_PASSWORD=" + values["KEYSTORE_PASSWORD"],
              "KEY_ALIAS=" + values["KEY_ALIAS"],
              "KEY_PASSWORD=" + values["KEY_PASSWORD"],
          ]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("\n".join(commands) + "\n")
          PY
          test -s "$RUNNER_TEMP/revision-signing.jks"
      - name: Verify signing key
        run: |
          keytool -list -keystore "$UPLOAD_KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Release signing key verified."
      - name: Run Android unit tests
        id: unit_tests
        if: github.ref != 'refs/heads/revision-device-card-ssh-approval-2026-11-26'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android startup smoke test
        id: startup_smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # GitHub-hosted Linux runners may not expose /dev/kvm. Without KVM,
          # the emulator exits unless software CPU emulation is explicitly enabled.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          script: |
            chmod +x ./gradlew
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.ymid.wakeonlan.ui.MainActivityTest#launches_showsDeviceList

      # Diagnostics must never hold up APK production if the emulator is unhealthy.
      - name: Capture emulator diagnostics on smoke-test failure
        if: steps.startup_smoke.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          timeout 20s adb logcat -d -v time -t 5000 > emulator-logcat.txt 2>&1 || true
          timeout 20s adb shell dumpsys activity activities > emulator-activities.txt 2>&1 || true
          timeout 20s adb shell dumpsys activity services > emulator-services.txt 2>&1 || true

      - name: Upload emulator diagnostics
        if: steps.startup_smoke.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: RE-Vision-Emulator-Diagnostics
          path: |
            emulator-logcat.txt
            emulator-activities.txt
            emulator-services.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Build APKs
        id: build_apks
        if: steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'skipped'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug assembleRelease \
            -PUPLOAD_KEYSTORE_PATH="$UPLOAD_KEYSTORE_PATH" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload Release APK
        if: steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: RE-Vision-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK
        if: steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: RE-Vision-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Report validation status
        if: always()
        run: |
          {
            echo "## RE:Vision build validation"
            echo "- Unit tests: ${{ steps.unit_tests.outcome }}"
            echo "- Emulator startup smoke test: ${{ steps.startup_smoke.outcome }}"
            if [ "${{ steps.startup_smoke.outcome }}" = "failure" ]; then
              echo "- WARNING: emulator smoke test failed; APK build was allowed to continue. See emulator diagnostics artifact if available."
            fi
            echo "- APK build step: ${{ steps.build_apks.outcome || 'not run' }}"
          } >> "$GITHUB_STEP_SUMMARY"
