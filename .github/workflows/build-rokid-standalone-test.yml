name: Build Rokid Standalone Test APK

on:
  push:
    branches:
      - revision-rokid-standalone-test
    paths:
      - "rokid-standalone-test/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/build-rokid-standalone-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build standalone diagnostic APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :rokid-standalone-test:clean :rokid-standalone-test:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Rokid-Standalone-Test-APK
          path: rokid-standalone-test/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
