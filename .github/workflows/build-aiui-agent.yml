name: Build RE:Vision AIUI Agent
# Rebuild after Russian intent routing correction
# Agent bridge diagnostics rebuild
# AIX artifact packaging retry

on:
  push:
    branches:
      - revision-aiui-agent
      - revision-pin-persistence-fix
    paths:
      - "aiui/revision-voice/**"
      - ".github/workflows/build-aiui-agent.yml"
  workflow_dispatch:

concurrency:
  group: revision-aiui-aix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install AIX CLI
        run: npm install --global @yodaos-pkg/aix-cli

      - name: Validate AIUI project
        run: aix check ./aiui/revision-voice

      - name: Package AIX
        run: |
          mkdir -p dist
          aix pack ./aiui/revision-voice -o ./dist/RE-Vision.aix

      - name: Upload AIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: RE-Vision-AIUI-AIX
          path: dist/RE-Vision.aix
          if-no-files-found: error
          retention-days: 14
