name: Build Rokid Diagnostics APK

on:
  push:
    branches:
      - rokid-diagnostics-2026-11-27
    paths:
      - "rokid-diagnostics/**"
      - ".github/workflows/rokid-diagnostics.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"
      - name: Build universal debug APK
        run: gradle -p rokid-diagnostics --no-daemon clean assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rokid-Diagnostics-APK
          path: rokid-diagnostics/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
