name: Build RE:Vision Windows Agent + Win SSH Agent
on:
  push:
    branches: [revision-windows-agent-prototype, revision-agent-manager-test, revision-windows-agent-integration-test, revision-windows-agent-apk-retry, revision-stability-polish-2026-11-24b, revision-ssh-key-only-2026-11-25, revision-voicebridge-tap-ssh-manager-2026-11-25, revision-win-ssh-web-manager-2026-11-25, revision-windows-agent-media-controls-2026-11-25]
    paths:
      - 'windows-agent/**'
      - 'ssh-agent/run-ssh-command.ps1'
      - '.github/workflows/windows-agent.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows service with Win SSH Agent runner
        shell: pwsh
        run: |
          dotnet publish windows-agent/Revision.WindowsAgent/Revision.WindowsAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o windows-agent/publish
          Copy-Item windows-agent/install-agent.ps1 windows-agent/publish/
          Copy-Item windows-agent/install-ssh-public-key.ps1 windows-agent/publish/
          Copy-Item windows-agent/uninstall-agent.ps1 windows-agent/publish/
          Copy-Item windows-agent/README.md windows-agent/publish/
          Copy-Item ssh-agent/run-ssh-command.ps1 windows-agent/publish/
          Compress-Archive -Path windows-agent/publish/* -DestinationPath windows-agent/Revision.WindowsAgent-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: revision-windows-agent-win-x64
          path: windows-agent/Revision.WindowsAgent-win-x64.zip
          if-no-files-found: error
