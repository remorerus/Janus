name: Build RE:Vision Windows Agent Installer
on:
  push:
    branches: [revision-windows-agent-prototype, revision-agent-manager-test, revision-windows-agent-integration-test, revision-windows-agent-apk-retry, revision-stability-polish-2026-11-24b, revision-ssh-key-only-2026-11-25, revision-voicebridge-tap-ssh-manager-2026-11-25, revision-win-ssh-web-manager-2026-11-25, revision-windows-agent-media-controls-2026-11-25, revision-voice-windows-controls-2026-11-25, revision-device-card-ssh-approval-2026-11-26, revision-fix-active-ip-agent-status-2026-11-27, revision-ssh-preserved-named-focus-2026-11-28]
    paths:
      - 'windows-agent/**'
      - 'ssh-agent/run-ssh-command.ps1'
      - '.github/workflows/windows-agent.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows service with Win SSH Agent runner
        shell: pwsh
        run: |
          dotnet publish windows-agent/Revision.WindowsAgent/Revision.WindowsAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o windows-agent/publish
          Copy-Item windows-agent/install-agent.ps1 windows-agent/publish/
          Copy-Item windows-agent/install-ssh-public-key.ps1 windows-agent/publish/
          Copy-Item windows-agent/uninstall-agent.ps1 windows-agent/publish/
          Copy-Item windows-agent/README.md windows-agent/publish/
          Copy-Item ssh-agent/run-ssh-command.ps1 windows-agent/publish/
          Compress-Archive -Path windows-agent/publish/* -DestinationPath windows-agent/Revision.WindowsAgent-win-x64.zip -Force
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build one-click Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc windows-agent/Revision.WindowsAgent-Setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "windows-agent/RE-Vision-Windows-Agent-Setup.exe")) { throw "Setup EXE was not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: RE-Vision-Windows-Agent-Installer
          path: |
            windows-agent/RE-Vision-Windows-Agent-Setup.exe
            windows-agent/Revision.WindowsAgent-win-x64.zip
          if-no-files-found: error
